<div class="expedientes-container">
  <div class="header">
    <div *ngIf="mostrarFormulario" class="formulario-box">
      <h3>Nuevo Expediente PDP</h3>

      <div class="form-grid">
        <input type="text" placeholder="Código PDP" [(ngModel)]="nuevoExpediente.expediente" />

        <input type="text" placeholder="Capacitación" [(ngModel)]="nuevoExpediente.capacitacion" />

        <input type="text" placeholder="Responsable" [(ngModel)]="nuevoExpediente.responsable" />

        <select [(ngModel)]="nuevoExpediente.estado">
          <option>TDR</option>
          <option>Logística</option>
          <option>Convocatoria</option>
          <option>Ejecución</option>
          <option>Finalizado</option>
        </select>

        <input type="number" placeholder="Presupuesto" [(ngModel)]="nuevoExpediente.presupuesto" />

        <input
          type="number"
          placeholder="Beneficiarios"
          [(ngModel)]="nuevoExpediente.beneficiarios"
        />
      </div>

      <div class="acciones-formulario">
        <button class="btn-guardar" (click)="guardarExpediente()">Guardar</button>

        <button class="btn-cancelar" (click)="cancelar()">Cancelar</button>
      </div>
    </div>
    <h2>📁 Expedientes PDP</h2>

    <button class="btn-nuevo" (click)="abrirFormulario()">+ Nuevo Expediente</button>
  </div>

  <div class="tabla-box">
    <table>
      <thead>
        <tr>
          <th>Expediente</th>
          <th>Capacitación</th>
          <th>Responsable</th>
          <th>Estado</th>
          <th>Presupuesto</th>
          <th>Beneficiarios</th>
          <th>Acciones</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let item of expedientes">
          <td>{{ item.expediente }}</td>

          <td>{{ item.capacitacion }}</td>

          <td>{{ item.responsable }}</td>

          <td>{{ item.estado }}</td>

          <td>S/. {{ item.presupuesto }}</td>

          <td>{{ item.beneficiarios }}</td>

          <td>
            <button class="btn-ver" (click)="verExpediente(item.expediente)">Ver</button>

            <button class="btn-editar" (click)="editarExpediente(item.expediente)">Editar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
