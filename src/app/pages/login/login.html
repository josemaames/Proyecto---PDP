<div class="login-container">
  <div class="login-card">
    ```
    <div class="logo-section">
      <img src="assets/logos/essalud-logo.png" alt="EsSalud" class="logo" />

      <h1>Sistema PDP</h1>

      <p>Plan de Desarrollo de Personas</p>
    </div>

    <form (ngSubmit)="ingresar()">
      <div class="input-group">
        <label>DNI</label>

        <input
          type="text"
          placeholder="Ingrese su DNI"
          [(ngModel)]="dni"
          name="dni"
          maxlength="8"
          required
        />
      </div>

      <div class="input-group">
        <label>Contraseña</label>

        <input
          type="password"
          placeholder="Ingrese su contraseña"
          [(ngModel)]="password"
          name="password"
          required
        />
      </div>

      <div *ngIf="error" class="error">
        {{ error }}
      </div>

      <button type="submit">Ingresar</button>
    </form>

    <div class="footer">EsSalud - Gerencia Central de Gestión de las Personas</div>
    ```
  </div>
</div>
