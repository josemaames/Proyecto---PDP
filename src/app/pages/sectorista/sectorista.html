<div class="app-layout">
  <!-- ===== NAVBAR ===== -->
  <nav class="app-nav">
    <div class="nav-izq">
      <button class="nav-hamburger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>
      <img src="somos-essalud.png" class="nav-logo" alt="Somos EsSalud" />
      <div class="nav-brand">
        <div class="nav-brand-title">Sistema de Gestión PDP</div>
        <div class="nav-brand-subtitle">Plan de Desarrollo de Personas</div>
      </div>
    </div>
    <div class="nav-der">
      <span class="nav-fecha">{{ fechaHoy }}</span>
      <button class="nav-avatar">{{ inicialUsuario }}</button>
    </div>
  </nav>

  <div class="perfil-superior">
    <nav class="menu-superior">
      <div class="menu-item activo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 10.5L12 3l9 7.5" />
          <path d="M5 9.5V21h14V9.5" />
        </svg>
        <span>Inicio</span>
      </div>
      <div class="menu-item" (click)="irA('/expedientes')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
        </svg>
        <span>Expedientes</span>
      </div>
      <div class="menu-item" (click)="irA('/personal-pdp')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
        <span>Personal</span>
      </div>
      <div class="menu-item cerrar" (click)="cerrarSesion()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
        <span>Salir</span>
      </div>
    </nav>
  </div>

  <div class="app-cuerpo">
    <aside class="sidebar"></aside>

    <!-- ===== CONTENIDO ===== -->
    <main class="app-contenido">
    </main>
  </div>
</div>
